<!DOCTYPE html>

<style>
:root{

  --cyan:#00e5ff; --cyan-glow:rgba(0,229,255,.5); --red:#ff3b4e; --red-glow:rgba(255,59,78,.5);

}
html[data-theme="light"]{

  --cyan:#2454ff; --cyan-glow:rgba(36,84,255,.28); --red:#e0273f; --red-glow:rgba(224,39,63,.25);
  --violet:#8b3fe0; --violet-glow:rgba(139,63,224,.25);
  --green:#1fa463; --green-glow:rgba(31,164,99,.25); --amber:#d98209; --gold:#c9930b; --silver:#8a97ab; --bronze:#b56a2e;
  --white:#10182a; --text:#2b3550; --dim:#6b7690; --grid:rgba(36,84,255,.05); --bgtop:#e2ddfb;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg-void);color:var(--text);font-family:var(--font-d);min-height:100vh;-webkit-tap-highlight-color:transparent;transition:background .3s,color .3s}
body{background-image:radial-gradient(ellipse 90% 60% at 15% 0%,rgba(0,229,255,.16),transparent 60%),radial-gradient(ellipse 90% 60% at 100% 15%,rgba(255,59,78,.13),transparent 55%),radial-gradient(ellipse 100% 70% at 50% 0%,var(--bgtop) 0%,var(--bg-void) 60%),linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:auto,auto,auto,44px 44px,44px 44px}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:.02em}
.mono{font-family:var(--font-m)}
::selection{background:var(--cyan-glow);color:var(--bg-void)}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
::placeholder{color:var(--dim)}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:22px 16px 60px;min-height:100vh;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;margin-bottom:20px;color:var(--dim);font-family:var(--font-m);font-size:11px;letter-spacing:.1em}
.top b{color:var(--cyan);text-shadow:0 0 10px var(--cyan-glow);font-family:var(--font-d);font-size:16px;letter-spacing:.03em;cursor:pointer}
.top .sp{flex:1}
.themeBtn{width:30px;height:30px;border-radius:50%;border:1px solid var(--panel-border);display:flex;align-items:center;justify-content:center;font-size:14px}

.panel::before,.panel::after{content:'';position:absolute;width:16px;height:16px;border:2px solid var(--cyan);opacity:.9}
.panel::before{top:-1px;left:-1px;border-right:none;border-bottom:none}

.panel.pr::before,.panel.pr::after{border-color:var(--red)}
.stack{display:flex;flex-direction:column;gap:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
textarea,input[type=text],input[type=number]{width:100%;background:rgba(120,140,160,.08);border:1px solid var(--panel-border);border-radius:4px;color:var(--white);font-family:var(--font-m);font-size:14px;padding:12px}

label{font-size:11px;letter-spacing:.1em;color:var(--dim);font-family:var(--font-m);display:block;margin-bottom:5px}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text)}
.step{font-family:var(--font-m);font-size:10px;letter-spacing:.16em;color:var(--violet);border-bottom:1px solid var(--panel-border);padding-bottom:6px;margin-top:4px}
.btn{border:1.5px solid var(--cyan);background:linear-gradient(135deg,rgba(0,229,255,.16),rgba(168,85,247,.14));color:var(--white);font-family:var(--font-d);font-weight:600;font-size:15px;letter-spacing:.03em;padding:14px 18px;border-radius:6px;transition:.18s;box-shadow:0 0 22px -8px var(--cyan-glow);width:auto}
.btn:hover{background:linear-gradient(135deg,rgba(0,229,255,.28),rgba(168,85,247,.22))}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;border-color:var(--panel-border);box-shadow:none;color:var(--dim)}
.btn.red{border-color:var(--red);box-shadow:0 0 22px -8px var(--red-glow);color:var(--red)}
.btn.red:hover{background:rgba(255,59,78,.1)}
.btn.skip{border-color:var(--dim);color:var(--dim);box-shadow:none;background:transparent;padding:10px}

.hint{color:var(--dim);font-size:13px;line-height:1.6}

.warn{color:var(--red);font-size:12px;margin-top:6px;font-family:var(--font-m)}
.plist{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.prow{display:flex;justify-content:space-between;padding:9px 12px;border:1px solid var(--panel-border);border-radius:4px;font-size:14px;animation:in .35s var(--ease)}
.qn{font-family:var(--font-m);color:var(--dim);font-size:12px;letter-spacing:.1em;margin-bottom:8px}
.qtext{font-size:22px;font-weight:700;line-height:1.4;margin-bottom:20px;animation:in .45s var(--ease);color:var(--white)}

.ans:nth-child(1){animation-delay:.03s}.ans:nth-child(2){animation-delay:.08s}.ans:nth-child(3){animation-delay:.13s}.ans:nth-child(4){animation-delay:.18s}

.ans.pick-ok{border-color:var(--green);background:rgba(43,255,168,.1);box-shadow:0 0 18px -6px var(--green-glow);animation:correctPulse .35s}

@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}
.pts-pop{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-family:var(--font-m);font-weight:700;color:var(--green);font-size:16px;animation:floatUp .9s ease forwards;pointer-events:none}

.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.timer-wrap{position:relative;width:58px;height:58px;flex:none}
.timer-ring{transform:rotate(-90deg)}
.timer-track{fill:none;stroke:rgba(120,140,160,.15);stroke-width:4}
.timer-bar{fill:none;stroke:var(--cyan);stroke-width:4;stroke-linecap:round;transition:stroke-dashoffset 1s linear,stroke .3s}

.timer-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-m);font-size:16px;color:var(--white)}
.center{text-align:center}
.qrbox{background:#fff;padding:10px;border-radius:8px;width:fit-content;margin:14px auto 0}
.linkbox{display:flex;gap:8px;margin-top:14px}
.linkbox input{flex:1;font-size:11px}
.stats-row{display:flex;gap:0;margin-bottom:16px;border:1px solid var(--panel-border);border-radius:6px;overflow:hidden}
.stats-row div{flex:1;text-align:center;padding:10px 4px;border-right:1px solid var(--panel-border)}
.stats-row div:last-child{border-right:none}
.stats-row b{display:block;font-family:var(--font-m);font-size:19px;color:var(--cyan)}
.stats-row span{font-size:9px;color:var(--dim);letter-spacing:.06em}
.lbrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1.5px solid var(--panel-border);border-radius:8px;margin-bottom:8px;background:linear-gradient(160deg,rgba(120,140,160,.07),rgba(168,85,247,.04))}

.lb-avatar{flex:none;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--bg-void);border:2px solid var(--cyan);color:var(--cyan)}
.lbrow.r1 .lb-avatar{border-color:var(--gold);color:var(--gold);box-shadow:0 0 10px -2px var(--gold)}
.lbrow.r2 .lb-avatar{border-color:var(--silver);color:var(--silver)}
.lbrow.r3 .lb-avatar{border-color:var(--bronze);color:var(--bronze)}
.lb-mid{flex:1;min-width:0}
.lbrow .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--white);display:flex;align-items:center;gap:6px}
.lb-bar{height:3px;background:rgba(120,140,160,.15);border-radius:2px;margin-top:5px;overflow:hidden}
.lb-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--violet));transition:width .4s var(--ease)}
.lbrow .sc{font-family:var(--font-m);color:var(--white);width:46px;text-align:right;flex:none;font-weight:700}
.lbrow.r1{box-shadow:0 0 18px -6px var(--gold);animation:rankGlow 2.2s ease-in-out infinite}
.lbrow.r2{border-color:var(--silver)}
.lbrow.r3{border-color:var(--bronze)}
@keyframes rankGlow{0%,100%{box-shadow:0 0 14px -6px var(--gold)}50%{box-shadow:0 0 24px -4px var(--gold)}}
@keyframes flicker{0%,100%{transform:scale(1) rotate(-2deg)}50%{transform:scale(1.15) rotate(3deg)}}
.streak-badge{display:inline-block;animation:flicker .6s ease-in-out infinite}
@keyframes scoreFlash{0%{box-shadow:0 0 0 0 var(--green-glow)}40%{box-shadow:0 0 26px 6px var(--green-glow)}100%{box-shadow:0 0 0 0 transparent}}
.lbrow.score-flash{animation:scoreFlash .8s ease}
.lbrow.owner .lb-avatar{border:2px solid transparent;background:linear-gradient(var(--bg-void),var(--bg-void)) padding-box,conic-gradient(from 0deg,var(--cyan),var(--violet),var(--red),var(--cyan)) border-box}
.lbrow.r2{border-color:var(--silver)}
.lbrow.r3{border-color:var(--bronze)}
.podium{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.prank{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--panel-border);border-radius:6px;animation:in .4s var(--ease) backwards}
.prank .medal{font-size:20px;width:26px;text-align:center}
.prank.r1{animation-delay:.05s;border-color:var(--gold);box-shadow:0 0 24px -8px var(--gold)}
.prank.r2{animation-delay:.15s;border-color:var(--silver)}
.prank.r3{animation-delay:.25s;border-color:var(--bronze)}
.prank:nth-child(n+4){animation-delay:.35s}
.prank .nm{flex:1;font-weight:600;color:var(--white)}
.prank .sc{font-family:var(--font-m);color:var(--dim);font-weight:700}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.waiting{animation:pulse 1.4s ease-in-out infinite}
.winbanner{font-family:var(--font-m);font-size:12px;letter-spacing:.2em;color:var(--gold);margin-bottom:6px}
.streak-badge{font-family:var(--font-m);font-size:11px;color:var(--amber);margin-left:5px}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--panel-bg);border:1px solid var(--cyan);border-radius:8px;padding:10px 16px;font-weight:600;color:var(--white);box-shadow:0 0 20px -6px var(--cyan-glow);z-index:997;backdrop-filter:blur(8px);animation:toastIn .3s var(--ease),toastOut .3s ease 2.2s forwards}

.review{margin-top:18px;text-align:left}
.revrow{border-left:3px solid var(--dim);padding:8px 10px;margin-bottom:8px;border-radius:4px;background:rgba(120,140,160,.05);font-size:13px}
.revrow.ok{border-color:var(--green)}

.revq{font-weight:600;margin-bottom:3px;color:var(--white)}

#devToggle{position:fixed;bottom:14px;right:14px;width:34px;height:34px;border-radius:50%;border:1px solid var(--panel-border);background:var(--panel-bg);backdrop-filter:blur(6px);z-index:900;font-size:14px;opacity:.45}

.ans.dev-hint{border-color:var(--gold);box-shadow:0 0 14px -4px var(--gold)}

const hashStr = s => { let h=0; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))|0; return Math.abs(h); };
function seededShuffle(arr, seed){
  const a = arr.slice(); let s = seed || 1;
  const rnd = () => { s = (s*9301+49297)%233280; return s/233280; };
  for(let i=a.length-1;i>0;i--){ const j = Math.floor(rnd()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function calcPoints(remain, qSeconds, streak){
  const frac = Math.max(0, Math.min(1, remain/qSeconds));
  return Math.round(400 + 600*frac) + Math.min(streak,5)*25;
}
function confettiBurst(){
  const layer = document.createElement('div');
  layer.style.cssText = 'position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:999';
  document.body.appendChild(layer);
  const colors = ['var(--cyan)','var(--red)','var(--green)','var(--amber)','var(--gold)'];
  for(let i=0;i<44;i++){
    const p = document.createElement('div');
    p.style.cssText = `position:absolute;top:-10px;left:${Math.random()*100}%;width:7px;height:13px;background:${colors[i%colors.length]};opacity:.9;border-radius:1px;animation:confFall ${2+Math.random()*1.5}s ease-in ${Math.random()*.4}s forwards`;
    layer.appendChild(p);
  }
  const st = document.createElement('style');
  st.textContent = '@keyframes confFall{to{transform:translateY(440px) rotate(360deg);opacity:0}}';
  layer.appendChild(st);
  setTimeout(()=>layer.remove(), 4200);
}
function spawnReactionFloat(emoji){
  const el = document.createElement('div');
  el.className = 'reaction-float'; el.textContent = emoji;
  el.style.left = (10+Math.random()*80)+'%';
  document.body.appendChild(el);

}
function showToast(text){
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = text;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2600);
}
function streakBadge(n){ return n>=2 ? '🔥'+n : ''; }
function withTimeout(promise, ms){
  return Promise.race([
    promise,
    new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')), ms||8000))
  ]);
}
let activeListeners = [];
function track(ref, event, cb){ ref.on(event, cb); activeListeners.push([ref, event, cb]); return cb; }
function cleanupListeners(){ activeListeners.forEach(([ref,ev,cb])=>{ try{ ref.off(ev, cb); }catch(e){} }); activeListeners = []; }

  app.innerHTML = `<div class="panel pr"><h2 style="color:var(--red)">FIREBASE NOT CONFIGURED</h2>

  return true;
}

function parseQuiz(raw){
  const lines = raw.replace(/\r/g,'').split('\n');
  const blocks = []; let cur = null;
  const qStart = /^\s*\d+[\.\)]\s*(.+)/, oStart = /^\s*([A-FА-Е])[\.\):]\s*(.+)/;
  for(const line of lines){
    if(!line.trim()) continue;
    const qm = line.match(qStart);
    if(qm && !line.trim().match(oStart)){ cur = {text: qm[1].trim(), options: []}; blocks.push(cur); continue; }
    const om = line.match(oStart);
    if(om && cur){
      let t = om[2].trim();
      const correct = /\[(правильный|верный|correct)\]|\[\+\]|\*\s*$/i.test(t);
      t = t.replace(/\[(правильный|верный|correct)\]|\[\+\]/ig,'').replace(/\*\s*$/,'').trim();
      cur.options.push({text:t, correct});
    }
  }
  blocks.forEach(q=>{
    const c = q.options.filter(o=>o.correct).length;
    q.warn = q.options.length<2 ? 'меньше двух вариантов' : c===0 ? 'правильный ответ не найден' : c>1 ? 'больше одного правильного' : null;
  });
  return blocks.filter(q=>q.text);
}

function nav(h){ location.hash = h; }

function render(){
  if(needsSetup()) return;
  cleanupListeners();
  const [route, a] = location.hash.slice(2).split('/');
  if(route==='create') return createView();
  if(route==='host') return hostView(a);
  if(route==='join') return joinView(a);
  if(route==='play') return playView(a);
  if(route==='watch') return watchView(a);
  homeView();
}

function createView(){
  app.innerHTML = `
    <div class="panel stack">
      <div class="step">ШАГ 1 · ОСНОВНОЕ</div>
      <div><label>НАЗВАНИЕ</label><input type="text" id="title" placeholder="Тест по теме..."></div>
      <div class="step">ШАГ 2 · НАСТРОЙКИ КОМНАТЫ</div>
      <div class="row2">
        <div><label>СЕКУНД НА ВОПРОС</label><input type="number" id="secs" value="20" min="5" max="120"></div>
        <div><label>МАКС. УЧАСТНИКОВ</label><input type="number" id="maxp" value="0" min="0" placeholder="0 = без лимита"></div>
      </div>
      <label class="chk"><input type="checkbox" id="shuffle" checked style="width:auto"> Перемешивать варианты ответов у каждого</label>
      <label class="chk"><input type="checkbox" id="shuffleQ" style="width:auto"> Перемешивать порядок вопросов у каждого</label>
      <div class="step">ШАГ 3 · ВОПРОСЫ</div>
      <div><div class="hint" style="margin-bottom:8px">Можно вставить все вопросы разом одним куском текста — просто следи, чтобы каждый начинался с номера («1.», «2.» и т.д.). Чтобы автоматически пометить правильный ответ, допиши у нужного варианта <span class="mono">[правильный]</span>, <span class="mono">[correct]</span>, <span class="mono">[+]</span> или <span class="mono">*</span> в конце строки. Если нигде не пометишь — после разбора просто нажми на верный вариант в списке ниже, он подставится сам.</div>
        <textarea id="src" placeholder="1. Что измеряется в амперах?
A) Напряжение
B) Сила тока [правильный]
C) Сопротивление
D) Мощность"></textarea>
      </div>
      <button class="btn" id="parse">Разобрать</button>
      <div id="preview"></div>
    </div>`;
  document.getElementById('parse').onclick = ()=>{
    const qs = parseQuiz(document.getElementById('src').value);
    renderPreview(qs);
  };

  function renderPreview(qs){
    const pv = document.getElementById('preview');
    if(!qs.length){ pv.innerHTML = '<div class="warn">Вопросы не найдены.</div>'; return; }
    const blocked = qs.filter(q=>q.warn==='меньше двух вариантов').length;
    const pending = qs.filter(q=>q.warn && q.warn!=='меньше двух вариантов').length;
    let html = `<div class="hint">Найдено: ${qs.length}${pending?`, нужно выбрать верный: <span style="color:var(--amber)">${pending}</span>`:''}${blocked?`, с ошибками: <span style="color:var(--red)">${blocked}</span>`:''}</div>`;
    qs.forEach((q,i)=>{
      const pickable = q.warn && q.warn!=='меньше двух вариантов';
      html += `<div class="qprev"><div class="n">В${i+1}</div><div style="margin:5px 0;font-weight:600">${q.text}</div>`;
      q.options.forEach((o,oi)=>{
        html += pickable
          ? `<button class="opt-row opt-pick" data-qi="${i}" data-oi="${oi}"><span class="m"></span>${o.text}</button>`
          : `<div class="opt-row ${o.correct?'ok':''}"><span class="m"></span>${o.text}</div>`;
      });
      if(q.warn==='меньше двух вариантов') html += `<div class="warn">⚠ меньше двух вариантов — исправь в тексте выше и разбери заново</div>`;
      else if(pickable) html += `<div class="warn" style="color:var(--amber)">⚠ нажми на верный вариант выше</div>`;
      html += `</div>`;
    });
    html += (blocked || pending) ? '' : '<button class="btn" id="launch" style="margin-top:12px">Запустить сессию</button>';
    pv.innerHTML = html;
    pv.querySelectorAll('.opt-pick').forEach(b=>b.onclick=()=>{
      const qi = +b.dataset.qi, oi = +b.dataset.oi;
      qs[qi].options.forEach((o,idx)=>o.correct = idx===oi);
      qs[qi].warn = null;
      renderPreview(qs);
    });
    const l = document.getElementById('launch');
    if(l) l.onclick = ()=>{
      if(l.disabled) return;
      l.disabled = true; l.textContent = 'Запускаем...';
      const title = document.getElementById('title').value.trim() || 'Тест';
      const qSeconds = Math.max(5, +document.getElementById('secs').value || 20);
      const maxPlayers = Math.max(0, +document.getElementById('maxp').value || 0);
      const shuffle = document.getElementById('shuffle').checked;
      const shuffleQuestions = document.getElementById('shuffleQ').checked;
      const code = genCode();
      db.ref('sessions/'+code).set({
        title, status:'lobby', qSeconds, maxPlayers, shuffle, shuffleQuestions, createdAt:Date.now(),
        questions: qs.map(q=>({t:q.text, o:q.options.map(o=>o.text), c:q.options.findIndex(o=>o.correct)}))
      });
      nav('#/host/'+code);
    };
  }
}

function hostView(code){
  const sRef = db.ref('sessions/'+code), pRef = db.ref('participants/'+code);
  const joinUrl = location.origin+location.pathname+'#/join/'+code;
  app.innerHTML = `<div class="panel center"><label>КОД СЕССИИ</label><div class="code-big">${code}</div>
    <div class="linkbox"><input type="text" readonly value="${joinUrl}" id="lk"><button class="btn ghost" id="cp">Копир.</button></div>
    <div class="qrbox" id="qr"></div><button class="leaveBtn" id="leave" style="margin-top:14px">← Выйти</button></div>
    <div id="hostBody"></div>`;
  document.getElementById('cp').onclick = ()=>{ document.getElementById('lk').select(); document.execCommand('copy'); };
  document.getElementById('leave').onclick = ()=>nav('#/');
  new QRCode(document.getElementById('qr'), {text: joinUrl, width:150, height:150, colorDark:"#0a1c2e", colorLight:"#ffffff"});
  track(db.ref('reactions/'+code), 'child_added', snap=>{ spawnReactionFloat(snap.val().emoji); snap.ref.remove(); });

  let sessionData = null, total = 0, celebrated = false;
  track(sRef, 'value', snap=>{
    sessionData = snap.val(); if(!sessionData) return;
    total = (sessionData.questions||[]).length;
    drawHost();
  });

  function drawHost(){
    const body = document.getElementById('hostBody');
    if(sessionData.status==='lobby'){
      track(pRef, 'value', psnap=>{
        const names = Object.values(psnap.val() || {});
        const capNote = sessionData.maxPlayers ? ` / ${sessionData.maxPlayers}` : '';
        body.innerHTML = `<div class="panel" style="margin-top:12px"><label>ПОДКЛЮЧИЛИСЬ (${names.length}${capNote})</label>
          <div class="plist">${names.map(p=>`<div class="prow">${avatarSVG(p.avatar||'scope',16)} ${p.name}${p.isDev?'<span class="owner-mark"></span>':''}</div>`).join('') || '<span class="hint">Пока никого</span>'}</div>
          <div style="margin-top:14px"><button class="btn" id="start" ${names.length?'':'disabled'}>Начать тест</button></div></div>`;
        const st = document.getElementById('start');
        if(st) st.onclick = ()=>sRef.update({status:'running'});
      });
    } else {
      body.innerHTML = `<div class="panel" style="margin-top:12px"><div id="stats"></div><label>ЖИВОЙ ТОП</label><div id="board" style="margin-top:12px"></div>
        ${sessionData.status==='running' ? '<button class="btn red ghost" id="forceEnd">Завершить для всех</button>' : '<div class="winbanner">🏆 РЕЗУЛЬТАТЫ</div>'}</div>`;
      const fe = document.getElementById('forceEnd');
      if(fe) fe.onclick = ()=>sRef.update({status:'finished'});
      track(pRef, 'value', psnap=>{
        const list = Object.entries(psnap.val()||{}).map(([pid,v])=>({pid,...v}));
        const finished = list.filter(p=>p.done).length;
        const avgIdx = list.length ? Math.round(list.reduce((s,p)=>s+(p.idx||0),0)/list.length) : 0;
        document.getElementById('stats').innerHTML = `<div class="stats-row">
          <div><b>${list.length}</b><span>ИГРОКОВ</span></div>
          <div><b>${finished}</b><span>ЗАВЕРШИЛИ</span></div>
          <div><b>${avgIdx}/${total}</b><span>СРЕДНИЙ ВОПРОС</span></div></div>`;
        renderLeaderboard(list, total);
        if(sessionData.status==='finished' && !celebrated && list.length){ celebrated = true; confettiBurst(); }
      });
    }
  }
}

function renderLeaderboard(list, total){
  const el = document.getElementById('board');
  if(!el) return;
  const prevTop = {};
  el.querySelectorAll('.lbrow').forEach(r=>{ prevTop[r.dataset.pid] = r.getBoundingClientRect().top; });
  const sorted = list.slice().sort((a,b)=> (b.score||0)-(a.score||0) || (b.idx||0)-(a.idx||0));
  const medal = i => i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1);
  el.innerHTML = sorted.map((p,i)=>`<div class="lbrow ${i<3?'r'+(i+1):''} ${p.isDev?'owner':''}" data-pid="${p.pid}">
      <span class="rank">${medal(i)}</span>
      <span class="lb-avatar">${avatarSVG(p.avatar||'scope',16)}</span>
      <span class="lb-mid"><span class="nm">${p.name}${p.streak>=2?`<span class="streak-badge">🔥${p.streak}</span>`:''}${p.isDev?'<span class="owner-mark"></span>':''}</span>
        <span class="lb-bar"><i style="width:${p.done?100:Math.round(((p.idx||0)/total)*100)}%"></i></span></span>
      <span class="sc">${p.score||0}</span></div>`).join('') || '<span class="hint">Пока никого</span>';
  el.querySelectorAll('.lbrow').forEach(r=>{
    const pid = r.dataset.pid, newTop = r.getBoundingClientRect().top, oldTop = prevTop[pid];
    if(oldTop !== undefined){
      const d = oldTop - newTop;
      if(Math.abs(d) > 1){
        r.style.transition = 'none'; r.style.transform = `translateY(${d}px)`;
        requestAnimationFrame(()=>{ r.style.transition = 'transform .45s cubic-bezier(.16,1,.3,1)'; r.style.transform = ''; });
      }
    } else {
      r.style.opacity = '0'; r.style.transform = 'translateY(8px)';
      requestAnimationFrame(()=>{ r.style.transition = '.35s'; r.style.opacity = '1'; r.style.transform = ''; });
    }
    const p = sorted.find(x=>x.pid===pid);
    if(p && lbPrevScores[pid]!==undefined && (p.score||0) > lbPrevScores[pid]){
      r.classList.add('score-flash');
      setTimeout(()=>r.classList.remove('score-flash'), 800);
    }
  });
  sorted.forEach(p=>{ lbPrevScores[p.pid] = p.score||0; });
}

    </div>
    <button class="btn" id="go">Войти</button><div id="err"></div></div>`;
  document.getElementById('back').onclick = ()=>nav('#/');
  document.querySelectorAll('.avatar-opt').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('.avatar-opt').forEach(x=>x.classList.remove('sel'));
    b.classList.add('sel'); selAvatar = b.dataset.a;
  });
  const rp = document.getElementById('rolePlayer'), rw = document.getElementById('roleWatch'), pf = document.getElementById('playerFields'), go = document.getElementById('go');
  rp.onclick = ()=>{ role='player'; rp.className='btn'; rw.className='btn ghost'; pf.style.display=''; go.textContent='Войти'; };
  rw.onclick = ()=>{ role='watch'; rw.className='btn'; rp.className='btn ghost'; pf.style.display='none'; go.textContent='Смотреть'; };
  go.onclick = ()=>{
    if(go.disabled) return;
    const code = document.getElementById('code').value.trim().toUpperCase();
    const err = document.getElementById('err');
    if(!code){ err.innerHTML = '<div class="warn">Введи код</div>'; return; }
    if(role==='watch'){
      go.disabled = true; go.textContent = 'Подключение...';
      withTimeout(db.ref('sessions/'+code).once('value')).then(snap=>{
        if(!snap.exists()){ err.innerHTML = '<div class="warn">Сессия не найдена</div>'; go.disabled=false; go.textContent='Смотреть'; return; }
        nav('#/watch/'+code);
      }).catch(()=>{ err.innerHTML = '<div class="warn">Не удалось подключиться — проверь интернет и код</div>'; go.disabled=false; go.textContent='Смотреть'; });
      return;
    }
    const name = document.getElementById('name').value.trim();
    if(!name){ err.innerHTML = '<div class="warn">Введи имя</div>'; return; }
    go.disabled = true; go.textContent = 'Подключение...';
    const sesRef = db.ref('sessions/'+code);
    withTimeout(sesRef.once('value')).then(snap=>{
      if(!snap.exists()){ err.innerHTML = '<div class="warn">Сессия не найдена</div>'; go.disabled=false; go.textContent='Войти'; return; }
      const s = snap.val();
      const doJoin = () => {
        const pid = genId();
        db.ref(`participants/${code}/${pid}`).set({name, avatar:selAvatar, score:0, idx:0, done:false, streak:0, isDev:isDevMode()});
        localStorage.setItem('cq_'+code, JSON.stringify({pid, name}));
        nav('#/play/'+code);
      };
      if(s.maxPlayers){
        withTimeout(db.ref('participants/'+code).once('value')).then(psnap=>{
          if(Object.keys(psnap.val()||{}).length >= s.maxPlayers){ err.innerHTML = '<div class="warn">Комната заполнена</div>'; go.disabled=false; go.textContent='Войти'; return; }
          doJoin();
        }).catch(()=>{ err.innerHTML = '<div class="warn">Не удалось подключиться — проверь интернет</div>'; go.disabled=false; go.textContent='Войти'; });
      } else doJoin();
    }).catch(()=>{ err.innerHTML = '<div class="warn">Не удалось подключиться — проверь интернет и код</div>'; go.disabled=false; go.textContent='Войти'; });
  };
}

function playView(code){
  const saved = JSON.parse(localStorage.getItem('cq_'+code) || 'null');
  if(!saved){ nav('#/join/'+code); return; }
  const pid = saved.pid;
  const sRef = db.ref('sessions/'+code), myRef = db.ref(`participants/${code}/${pid}`);
  let idx = 0, score = 0, streak = 0, done = false, questions = [], qOrder = [], qSeconds = 20, shuffle = true, forcedEnd = false, drawnFor = -1, timerInt = null, sessionStatus = 'lobby', lastRank = null;

  track(db.ref('participants/'+code), 'value', snap=>{
    const list = Object.entries(snap.val()||{}).map(([id,v])=>({id,...v})).sort((a,b)=>(b.score||0)-(a.score||0));
    const myIdx = list.findIndex(p=>p.id===pid);
    if(myIdx===-1) return;
    const rank = myIdx+1;
    if(lastRank!==null && rank<lastRank && sessionStatus==='running') showToast('🔺 Поднялся на '+rank+' место!');
    lastRank = rank;
  });

  track(sRef, 'value', snap=>{
    const s = snap.val(); if(!s) return;
    questions = s.questions || []; qSeconds = s.qSeconds || 20; shuffle = s.shuffle !== false;
    qOrder = s.shuffleQuestions ? seededShuffle(questions.map((_,i)=>i), hashStr(pid)) : questions.map((_,i)=>i);
    sessionStatus = s.status;
    if(s.status === 'finished') forcedEnd = true;
    if(s.status === 'lobby' && drawnFor === -1){
      app.innerHTML = `<div class="panel center waiting"><h2>${s.title}</h2><p class="hint">Ожидание начала...</p></div>
        <button class="leaveBtn" id="leave" style="margin-top:14px">← Выйти</button>`;
      const lv = document.getElementById('leave'); if(lv) lv.onclick = ()=>nav('#/');
    }
    tick();
  });
  myRef.once('value').then(snap=>{
    const p = snap.val() || {}; idx = p.idx||0; score = p.score||0; streak = p.streak||0; done = !!p.done; tick();
  });

  function tick(){
    if(!questions.length) return;
    if(done || forcedEnd){ clearInterval(timerInt); showResult(); return; }
    if(sessionStatus !== 'running') return;
    if(drawnFor !== idx) drawQuestion();
  }

  function showResult(){
    if(isDevMode()) firebase.auth().signOut();
    Promise.all([db.ref('participants/'+code).once('value'), myRef.once('value')]).then(([psnap, mesnap])=>{
      const list = Object.entries(psnap.val()||{}).map(([id,v])=>({id,...v})).sort((a,b)=>(b.score||0)-(a.score||0));
      const rank = list.findIndex(p=>p.id===pid) + 1;
      const isTop3 = rank>0 && rank<=3;
      const myAnswers = (mesnap.val()||{}).answers || {};
      const reviewHtml = qOrder.map((qi,pos)=>{
        const q = questions[qi];
        const a = myAnswers[pos];
        const skipped = a===undefined || a===-1;
        const correct = !skipped && a===q.c;
        return `<div class="revrow ${correct?'ok':'bad'}"><div class="revq">${pos+1}. ${q.t}</div>
          <div class="revans">${skipped?'пропущено':'твой ответ: '+q.o[a]}${!correct?` · верный: ${q.o[q.c]}`:''}</div></div>`;
      }).join('');
      app.innerHTML = `<div class="panel center">
        ${isTop3 ? `<div class="winbanner">${rank===1?'🥇 ПЕРВОЕ МЕСТО':rank===2?'🥈 ВТОРОЕ МЕСТО':'🥉 ТРЕТЬЕ МЕСТО'}</div>` : ''}
        <h2>Тест завершён</h2><div class="code-big">${score}</div><p class="hint">очков · место ${rank || '—'} из ${list.length} · ${saved.name}</p>
        <div class="review">${reviewHtml}</div></div>
        <button class="leaveBtn" id="leave" style="margin-top:14px">← На главную</button>`;
      document.getElementById('leave').onclick = ()=>nav('#/');
      if(isTop3) confettiBurst();
    });
  }

  function drawQuestion(){
    drawnFor = idx;
    const q = questions[qOrder[idx]], total = questions.length;
    const order = shuffle ? seededShuffle(q.o.map((_,i)=>i), hashStr(pid+'_'+idx)) : q.o.map((_,i)=>i);
    const letters = 'ABCD';
    const circ = 2*Math.PI*18;
    app.innerHTML = `
      <div class="qhead">
        <div class="qn">ВОПРОС ${idx+1} / ${total}<br><span class="mono" style="color:var(--cyan)">${score} очк. ${streakBadge(streak)}</span></div>
        <div class="timer-wrap"><svg class="timer-ring" viewBox="0 0 40 40">
          <circle class="timer-track" cx="20" cy="20" r="18"/>
          <circle class="timer-bar" id="tbar" cx="20" cy="20" r="18" stroke-dasharray="${circ}" stroke-dashoffset="0"/>
        </svg><span class="timer-num" id="tnum">${qSeconds}</span></div>
      </div>
      <div class="qtext">${q.t}</div>
      <div class="answers" id="ans">${order.map((origI,pos)=>`<button class="ans ${isDevMode()&&origI===q.c?'dev-hint':''}" data-i="${origI}"><span class="ans-letter">${letters[pos]}</span>${q.o[origI]}${isDevMode()&&origI===q.c?'<span class="dev-tag">✓</span>':''}</button>`).join('')}</div>
      <button class="btn skip" id="skipBtn" style="margin-top:12px;width:100%">Пропустить →</button>
      <div class="reaction-bar">${['🔥','⚡','👏','💀'].map(e=>`<button class="reaction-btn" data-e="${e}">${e}</button>`).join('')}</div>`;

    const tbar = document.getElementById('tbar'), tnum = document.getElementById('tnum');
    requestAnimationFrame(()=>{ tbar.style.strokeDashoffset = circ; });
    let remain = qSeconds;
    clearInterval(timerInt);
    timerInt = setInterval(()=>{
      remain--;
      tnum.textContent = Math.max(remain,0);
      tbar.classList.toggle('warn', remain<=qSeconds*0.5 && remain>qSeconds*0.25);
      tbar.classList.toggle('danger', remain<=qSeconds*0.25);
      if(remain<=0){ clearInterval(timerInt); if(navigator.vibrate) navigator.vibrate(50); commit(null, 0); }
    }, 1000);

    document.querySelectorAll('.reaction-btn').forEach(b=>b.onclick=()=>{
      db.ref('reactions/'+code).push({emoji:b.dataset.e, ts:Date.now()});
      if(navigator.vibrate) navigator.vibrate(15);
    });

    document.querySelectorAll('#ans .ans').forEach(b=>b.onclick=()=>{
      clearInterval(timerInt);
      const i = +b.dataset.i, ok = i===q.c;
      const pts = ok ? calcPoints(remain, qSeconds, streak) : 0;
      if(navigator.vibrate) navigator.vibrate(ok ? 30 : [40,30,40]);
      b.classList.add(ok?'pick-ok':'pick-bad');
      if(ok){ const pop = document.createElement('span'); pop.className='pts-pop'; pop.textContent='+'+pts; b.appendChild(pop); }
      document.querySelectorAll('#ans .ans').forEach(x=>x.disabled=true);
      document.getElementById('skipBtn').disabled = true;
      setTimeout(()=>commit(i, pts), 550);
    });
    document.getElementById('skipBtn').onclick = ()=>{ clearInterval(timerInt); if(navigator.vibrate) navigator.vibrate(15); commit(null, 0); };
  }

  function commit(optIndex, pts){
    const q = questions[qOrder[idx]];
    const ok = optIndex !== null && optIndex === q.c;
    const qIndex = idx;
    score += pts;
    streak = ok ? streak+1 : 0;
    idx++;
    done = idx >= questions.length;
    const upd = {score, idx, done, streak};
    upd['answers/'+qIndex] = (optIndex===null ? -1 : optIndex);
    myRef.update(upd);
    tick();
  }
}
</script>
