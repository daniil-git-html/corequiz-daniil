}
html[data-theme="light"]{

html,body{margin:0;background:var(--bg-void);color:var(--text);font-family:var(--font-d);min-height:100vh;-webkit-tap-highlight-color:transparent;transition:background .3s,color .3s}

.mono{font-family:var(--font-m)}
::selection{background:var(--cyan-glow);color:var(--bg-void)}

const app = document.getElementById('app');
const genCode = () => Math.random().toString(36).slice(2,7).toUpperCase();
const genId = () => Math.random().toString(36).slice(2,10);
const hashStr = s => { let h=0; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))|0; return Math.abs(h); };
function seededShuffle(arr, seed){
  const a = arr.slice(); let s = seed || 1;
  const rnd = () => { s = (s*9301+49297)%233280; return s/233280; };
  for(let i=a.length-1;i>0;i--){ const j = Math.floor(rnd()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function calcPoints(remain, qSeconds, streak){
  const frac = Math.max(0, Math.min(1, remain/qSeconds));
  return Math.round(400 + 600*frac) + Math.min(streak,5)*25;
}
function confettiBurst(){
  const layer = document.createElement('div');
  layer.style.cssText = 'position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:999';
  document.body.appendChild(layer);
  const colors = ['var(--cyan)','var(--red)','var(--green)','var(--amber)','var(--gold)'];
  for(let i=0;i<44;i++){
    const p = document.createElement('div');
    p.style.cssText = `position:absolute;top:-10px;left:${Math.random()*100}%;width:7px;height:13px;background:${colors[i%colors.length]};opacity:.9;border-radius:1px;animation:confFall ${2+Math.random()*1.5}s ease-in ${Math.random()*.4}s forwards`;
    layer.appendChild(p);
  }
  const st = document.createElement('style');
  st.textContent = '@keyframes confFall{to{transform:translateY(440px) rotate(360deg);opacity:0}}';
  layer.appendChild(st);
  setTimeout(()=>layer.remove(), 4200);
}

function needsSetup(){

  app.innerHTML = `<div class="panel pr"><h2 style="color:var(--red)">FIREBASE NOT CONFIGURED</h2>

function parseQuiz(raw){
  const lines = raw.replace(/\r/g,'').split('\n');
  const blocks = []; let cur = null;
  const qStart = /^\s*\d+[\.\)]\s*(.+)/, oStart = /^\s*([A-FА-Е])[\.\):]\s*(.+)/;
  for(const line of lines){
    if(!line.trim()) continue;
    const qm = line.match(qStart);
    if(qm && !line.trim().match(oStart)){ cur = {text: qm[1].trim(), options: []}; blocks.push(cur); continue; }
    const om = line.match(oStart);
    if(om && cur){
      let t = om[2].trim();
      const correct = /\[(правильный|верный|correct)\]|\[\+\]|\*\s*$/i.test(t);
      t = t.replace(/\[(правильный|верный|correct)\]|\[\+\]/ig,'').replace(/\*\s*$/,'').trim();
      cur.options.push({text:t, correct});
    }
  }
  blocks.forEach(q=>{
    const c = q.options.filter(o=>o.correct).length;
    q.warn = q.options.length<2 ? 'меньше двух вариантов' : c===0 ? 'правильный ответ не найден' : c>1 ? 'больше одного правильного' : null;
  });
  return blocks.filter(q=>q.text);
}

function nav(h){ location.hash = h; }
window.addEventListener('hashchange', render);
window.addEventListener('load', render);

function render(){
  if(needsSetup()) return;
  const [route, a] = location.hash.slice(2).split('/');
  if(route==='create') return createView();
  if(route==='host') return hostView(a);
  if(route==='join') return joinView(a);
  if(route==='play') return playView(a);
  if(route==='watch') return watchView(a);
  homeView();
}

function homeView(){
  app.innerHTML = `
    <button class="panel home-opt" id="toCreate"><div class="lbl">01 / ORGANIZER</div><h2>Создать тест</h2><p class="hint">Вставь вопросы текстом — запусти живую сессию для группы.</p></button>
    <button class="panel pr home-opt" id="toJoin"><div class="lbl">02 / PARTICIPANT</div><h2>Подключиться</h2><p class="hint">Есть код от организатора — заходи и отвечай.</p></button>`;
  document.getElementById('toCreate').onclick = ()=>nav('#/create');
  document.getElementById('toJoin').onclick = ()=>nav('#/join');
}

function createView(){
  app.innerHTML = `
    <div class="panel stack">
      <div><label>НАЗВАНИЕ</label><input type="text" id="title" placeholder="Тест по теме..."></div>
      <div class="row2">
        <div><label>СЕКУНД НА ВОПРОС</label><input type="number" id="secs" value="20" min="5" max="120"></div>
        <div><label>МАКС. УЧАСТНИКОВ</label><input type="number" id="maxp" value="0" min="0" placeholder="0 = без лимита"></div>
      </div>
      <label class="chk"><input type="checkbox" id="shuffle" checked style="width:auto"> Перемешивать варианты ответов у каждого</label>
      <div><label>ВОПРОСЫ</label>
        <textarea id="src" placeholder="1. Что измеряется в амперах?
A) Напряжение
B) Сила тока [правильный]
C) Сопротивление
D) Мощность"></textarea>
      </div>
      <div class="hint">Нумерация «1.»/«1)», варианты «A)» «A.» «A:», метка правильного — [правильный] / [correct] / [+] / *</div>
      <button class="btn" id="parse">Разобрать</button>
      <div id="preview"></div>
    </div>`;
  document.getElementById('parse').onclick = ()=>{
    const qs = parseQuiz(document.getElementById('src').value);
    const pv = document.getElementById('preview');
    if(!qs.length){ pv.innerHTML = '<div class="warn">Вопросы не найдены.</div>'; return; }
    const bad = qs.filter(q=>q.warn).length;
    let html = `<div class="hint">Найдено: ${qs.length}${bad?`, с ошибками: <span style="color:var(--red)">${bad}</span>`:''}</div>`;
    qs.forEach((q,i)=>{
      html += `<div class="qprev"><div class="n">В${i+1}</div><div style="margin:5px 0;font-weight:600">${q.text}</div>`;
      q.options.forEach(o=>html += `<div class="opt-row ${o.correct?'ok':''}"><span class="m"></span>${o.text}</div>`);
      if(q.warn) html += `<div class="warn">⚠ ${q.warn}</div>`;
      html += `</div>`;
    });
    html += bad ? '<div class="warn">Исправь текст и разбери заново.</div>' : '<button class="btn" id="launch" style="margin-top:12px">Запустить сессию</button>';
    pv.innerHTML = html;
    const l = document.getElementById('launch');
    if(l) l.onclick = ()=>{
      const title = document.getElementById('title').value.trim() || 'Тест';
      const qSeconds = Math.max(5, +document.getElementById('secs').value || 20);
      const maxPlayers = Math.max(0, +document.getElementById('maxp').value || 0);
      const shuffle = document.getElementById('shuffle').checked;
      const code = genCode();
      db.ref('sessions/'+code).set({
        title, status:'lobby', qSeconds, maxPlayers, shuffle, createdAt:Date.now(),
        questions: qs.map(q=>({t:q.text, o:q.options.map(o=>o.text), c:q.options.findIndex(o=>o.correct)}))
      }).then(()=>nav('#/host/'+code));
    };
  };
}

function hostView(code){
  const sRef = db.ref('sessions/'+code), pRef = db.ref('participants/'+code);
  const joinUrl = location.origin+location.pathname+'#/join/'+code;
  app.innerHTML = `<div class="panel center"><label>КОД СЕССИИ</label><div class="code-big">${code}</div>
    <div class="linkbox"><input type="text" readonly value="${joinUrl}" id="lk"><button class="btn ghost" id="cp">Копир.</button></div>
    <div class="qrbox" id="qr"></div><button class="leaveBtn" id="leave" style="margin-top:14px">← Выйти</button></div>
    <div id="hostBody"></div>`;
  document.getElementById('cp').onclick = ()=>{ document.getElementById('lk').select(); document.execCommand('copy'); };
  document.getElementById('leave').onclick = ()=>nav('#/');
  new QRCode(document.getElementById('qr'), {text: joinUrl, width:150, height:150, colorDark:"#0a1c2e", colorLight:"#ffffff"});
  db.ref('reactions/'+code).on('child_added', snap=>{ spawnReactionFloat(snap.val().emoji); snap.ref.remove(); });

  let sessionData = null, total = 0, celebrated = false;
  sRef.on('value', snap=>{
    sessionData = snap.val(); if(!sessionData) return;
    total = (sessionData.questions||[]).length;
    drawHost();
  });

  function drawHost(){
    const body = document.getElementById('hostBody');
    if(sessionData.status==='lobby'){
      pRef.on('value', psnap=>{
        const names = Object.values(psnap.val() || {});
        const capNote = sessionData.maxPlayers ? ` / ${sessionData.maxPlayers}` : '';
        body.innerHTML = `<div class="panel" style="margin-top:12px"><label>ПОДКЛЮЧИЛИСЬ (${names.length}${capNote})</label>
          <div class="plist">${names.map(p=>`<div class="prow">${p.avatar||'🎯'} ${p.name}${p.isDev?'<span class="owner-mark"></span>':''}</div>`).join('') || '<span class="hint">Пока никого</span>'}</div>
          <div style="margin-top:14px"><button class="btn" id="start" ${names.length?'':'disabled'}>Начать тест</button></div></div>`;
        const st = document.getElementById('start');
        if(st) st.onclick = ()=>sRef.update({status:'running'});
      });
    } else {
      body.innerHTML = `<div class="panel" style="margin-top:12px"><div id="stats"></div><label>ЖИВОЙ ТОП</label><div id="board" style="margin-top:12px"></div>
        ${sessionData.status==='running' ? '<button class="btn red ghost" id="forceEnd">Завершить для всех</button>' : '<div class="winbanner">🏆 РЕЗУЛЬТАТЫ</div>'}</div>`;
      const fe = document.getElementById('forceEnd');
      if(fe) fe.onclick = ()=>sRef.update({status:'finished'});
      pRef.on('value', psnap=>{
        const list = Object.entries(psnap.val()||{}).map(([pid,v])=>({pid,...v}));
        const finished = list.filter(p=>p.done).length;
        const avgIdx = list.length ? Math.round(list.reduce((s,p)=>s+(p.idx||0),0)/list.length) : 0;
        document.getElementById('stats').innerHTML = `<div class="stats-row">
          <div><b>${list.length}</b><span>ИГРОКОВ</span></div>
          <div><b>${finished}</b><span>ЗАВЕРШИЛИ</span></div>
          <div><b>${avgIdx}/${total}</b><span>СРЕДНИЙ ВОПРОС</span></div></div>`;
        renderLeaderboard(list, total);
        if(sessionData.status==='finished' && !celebrated && list.length){ celebrated = true; confettiBurst(); }
      });
    }
  }
}

function renderLeaderboard(list, total){
  const el = document.getElementById('board');
  if(!el) return;
  const prevTop = {};
  el.querySelectorAll('.lbrow').forEach(r=>{ prevTop[r.dataset.pid] = r.getBoundingClientRect().top; });
  const sorted = list.slice().sort((a,b)=> (b.score||0)-(a.score||0) || (b.idx||0)-(a.idx||0));
  const medal = i => i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1);
  el.innerHTML = sorted.map((p,i)=>`<div class="lbrow ${i<3?'r'+(i+1):''} ${p.isDev?'owner':''}" data-pid="${p.pid}">
      <span class="rank">${medal(i)}</span><span class="nm">${p.avatar||'🎯'} ${p.name}${p.isDev?'<span class="owner-mark"></span>':''}</span>
      <span class="prog">${p.done?'✓':(p.idx||0)+'/'+total}</span>
      <span class="streak-badge">${streakBadge(p.streak||0)}</span>
      <span class="sc">${p.score||0}</span></div>`).join('') || '<span class="hint">Пока никого</span>';
  el.querySelectorAll('.lbrow').forEach(r=>{
    const pid = r.dataset.pid, newTop = r.getBoundingClientRect().top, oldTop = prevTop[pid];
    if(oldTop !== undefined){
      const d = oldTop - newTop;
      if(Math.abs(d) > 1){
        r.style.transition = 'none'; r.style.transform = `translateY(${d}px)`;
        requestAnimationFrame(()=>{ r.style.transition = 'transform .45s cubic-bezier(.16,1,.3,1)'; r.style.transform = ''; });
      }
    } else {
      r.style.opacity = '0'; r.style.transform = 'translateY(8px)';
      requestAnimationFrame(()=>{ r.style.transition = '.35s'; r.style.opacity = '1'; r.style.transform = ''; });
    }
  });
}

function watchView(code){

  app.innerHTML = `<button class="leaveBtn" id="leave" style="margin-bottom:12px">← Выйти</button>
    <div class="panel center"><label>РЕЖИМ НАБЛЮДАТЕЛЯ</label><h2 id="wtitle">…</h2></div>
    <div id="watchBody"></div>`;
  document.getElementById('leave').onclick = ()=>nav('#/');
  db.ref('reactions/'+code).on('child_added', snap=>spawnReactionFloat(snap.val().emoji));

  let total = 0, celebrated = false, bodyBuilt = false;
  sRef.on('value', snap=>{
    const s = snap.val(); if(!s) return;
    total = (s.questions||[]).length;
    document.getElementById('wtitle').textContent = s.title;
    const wb = document.getElementById('watchBody');
    if(s.status==='lobby'){
      bodyBuilt = false;
      wb.innerHTML = `<div class="panel center waiting" style="margin-top:12px"><p class="hint">Сессия ещё не началась...</p></div>`;
    } else {
      if(!bodyBuilt){
        bodyBuilt = true;
        wb.innerHTML = `<div class="panel" style="margin-top:12px"><div id="stats"></div><label>ЖИВОЙ ТОП</label><div id="board" style="margin-top:12px"></div></div>`;
      }
      pRef.on('value', psnap=>{
        const list = Object.entries(psnap.val()||{}).map(([pid,v])=>({pid,...v}));
        const finished = list.filter(p=>p.done).length;
        const avgIdx = list.length ? Math.round(list.reduce((a,p)=>a+(p.idx||0),0)/list.length) : 0;
        document.getElementById('stats').innerHTML = `<div class="stats-row">
          <div><b>${list.length}</b><span>ИГРОКОВ</span></div>
          <div><b>${finished}</b><span>ЗАВЕРШИЛИ</span></div>
          <div><b>${avgIdx}/${total}</b><span>СРЕДНИЙ ВОПРОС</span></div></div>`;
        renderLeaderboard(list, total);
        if(s.status==='finished' && !celebrated && list.length){ celebrated = true; confettiBurst(); }

function joinView(prefill){
  const avatars = ['🦾','🐺','🦅','🐉','⚔️','🎯','🛡️','🚀','🔥','⚡'];
  let selAvatar = avatars[0], role = 'player';
  app.innerHTML = `<button class="leaveBtn" id="back" style="margin-bottom:12px">← Назад</button>
    <div class="panel stack">
    <div class="row2">
      <button class="btn" id="rolePlayer" style="padding:10px">Участник</button>
      <button class="btn ghost" id="roleWatch" style="padding:10px">Наблюдатель</button>
    </div>
    <div><label>КОД СЕССИИ</label><input type="text" id="code" style="text-transform:uppercase" value="${prefill||''}"></div>
    <div id="playerFields">
      <div><label>ТВОЁ ИМЯ</label><input type="text" id="name"></div>
      <div><label>ИКОНКА</label><div class="avatar-grid" id="avgrid">${avatars.map((a,i)=>`<button class="avatar-opt ${i===0?'sel':''}" data-a="${a}">${a}</button>`).join('')}</div></div>
    </div>
    <button class="btn" id="go">Войти</button><div id="err"></div></div>`;
  document.getElementById('back').onclick = ()=>nav('#/');
  document.querySelectorAll('.avatar-opt').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('.avatar-opt').forEach(x=>x.classList.remove('sel'));
    b.classList.add('sel'); selAvatar = b.dataset.a;
  });
  const rp = document.getElementById('rolePlayer'), rw = document.getElementById('roleWatch'), pf = document.getElementById('playerFields'), go = document.getElementById('go');
  rp.onclick = ()=>{ role='player'; rp.className='btn'; rw.className='btn ghost'; pf.style.display=''; go.textContent='Войти'; };
  rw.onclick = ()=>{ role='watch'; rw.className='btn'; rp.className='btn ghost'; pf.style.display='none'; go.textContent='Смотреть'; };
  go.onclick = ()=>{
    const code = document.getElementById('code').value.trim().toUpperCase();
    const err = document.getElementById('err');
    if(!code){ err.innerHTML = '<div class="warn">Введи код</div>'; return; }
    if(role==='watch'){
      db.ref('sessions/'+code).once('value').then(snap=>{
        if(!snap.exists()){ err.innerHTML = '<div class="warn">Сессия не найдена</div>'; return; }
        nav('#/watch/'+code);
      });
      return;
    }
    const name = document.getElementById('name').value.trim();
    if(!name){ err.innerHTML = '<div class="warn">Введи имя</div>'; return; }
    const sesRef = db.ref('sessions/'+code);
    sesRef.once('value').then(snap=>{
      if(!snap.exists()){ err.innerHTML = '<div class="warn">Сессия не найдена</div>'; return; }
      const s = snap.val();
      const doJoin = () => {
        const pid = genId();
        db.ref(`participants/${code}/${pid}`).set({name, avatar:selAvatar, score:0, idx:0, done:false, streak:0, isDev:isDevMode()}).then(()=>{
          localStorage.setItem('cq_'+code, JSON.stringify({pid, name}));
          nav('#/play/'+code);
        });
      };
      if(s.maxPlayers){
        db.ref('participants/'+code).once('value').then(psnap=>{
          if(Object.keys(psnap.val()||{}).length >= s.maxPlayers){ err.innerHTML = '<div class="warn">Комната заполнена</div>'; return; }
          doJoin();
        });
      } else doJoin();
    });
  };
}

function playView(code){
  const saved = JSON.parse(localStorage.getItem('cq_'+code) || 'null');
  if(!saved){ nav('#/join/'+code); return; }
  const pid = saved.pid;
  const sRef = db.ref('sessions/'+code), myRef = db.ref(`participants/${code}/${pid}`);
  let idx = 0, score = 0, streak = 0, done = false, questions = [], qSeconds = 20, shuffle = true, forcedEnd = false, drawnFor = -1, timerInt = null, sessionStatus = 'lobby', lastRank = null;

  db.ref('participants/'+code).on('value', snap=>{
    const list = Object.entries(snap.val()||{}).map(([id,v])=>({id,...v})).sort((a,b)=>(b.score||0)-(a.score||0));
    const myIdx = list.findIndex(p=>p.id===pid);
    if(myIdx===-1) return;
    const rank = myIdx+1;
    if(lastRank!==null && rank<lastRank && sessionStatus==='running') showToast('🔺 Поднялся на '+rank+' место!');
    lastRank = rank;
  });

  sRef.on('value', snap=>{
    const s = snap.val(); if(!s) return;
    questions = s.questions || []; qSeconds = s.qSeconds || 20; shuffle = s.shuffle !== false;
    sessionStatus = s.status;
    if(s.status === 'finished') forcedEnd = true;
    if(s.status === 'lobby' && drawnFor === -1){
      app.innerHTML = `<div class="panel center waiting"><h2>${s.title}</h2><p class="hint">Ожидание начала...</p></div>
        <button class="leaveBtn" id="leave" style="margin-top:14px">← Выйти</button>`;
      const lv = document.getElementById('leave'); if(lv) lv.onclick = ()=>nav('#/');
    }
    tick();
  });
  myRef.once('value').then(snap=>{
    const p = snap.val() || {}; idx = p.idx||0; score = p.score||0; streak = p.streak||0; done = !!p.done; tick();
  });

  function tick(){
    if(!questions.length) return;
    if(done || forcedEnd){ clearInterval(timerInt); showResult(); return; }
    if(sessionStatus !== 'running') return;
    if(drawnFor !== idx) drawQuestion();
  }

  function showResult(){
    Promise.all([db.ref('participants/'+code).once('value'), myRef.once('value')]).then(([psnap, mesnap])=>{
      const list = Object.entries(psnap.val()||{}).map(([id,v])=>({id,...v})).sort((a,b)=>(b.score||0)-(a.score||0));
      const rank = list.findIndex(p=>p.id===pid) + 1;
      const isTop3 = rank>0 && rank<=3;
      const myAnswers = (mesnap.val()||{}).answers || {};
      const reviewHtml = questions.map((q,i)=>{
        const a = myAnswers[i];
        const skipped = a===undefined || a===-1;
        const correct = !skipped && a===q.c;
        return `<div class="revrow ${correct?'ok':'bad'}"><div class="revq">${i+1}. ${q.t}</div>
          <div class="revans">${skipped?'пропущено':'твой ответ: '+q.o[a]}${!correct?` · верный: ${q.o[q.c]}`:''}</div></div>`;
      }).join('');
      app.innerHTML = `<div class="panel center">
        ${isTop3 ? `<div class="winbanner">${rank===1?'🥇 ПЕРВОЕ МЕСТО':rank===2?'🥈 ВТОРОЕ МЕСТО':'🥉 ТРЕТЬЕ МЕСТО'}</div>` : ''}
        <h2>Тест завершён</h2><div class="code-big">${score}</div><p class="hint">очков · место ${rank || '—'} из ${list.length} · ${saved.name}</p>
        <div class="review">${reviewHtml}</div></div>
        <button class="leaveBtn" id="leave" style="margin-top:14px">← На главную</button>`;
      document.getElementById('leave').onclick = ()=>nav('#/');
      if(isTop3) confettiBurst();
    });
  }

  function drawQuestion(){
    drawnFor = idx;
    const q = questions[idx], total = questions.length;
    const order = shuffle ? seededShuffle(q.o.map((_,i)=>i), hashStr(pid+'_'+idx)) : q.o.map((_,i)=>i);
    const circ = 2*Math.PI*18;
    app.innerHTML = `
      <div class="qhead">
        <div class="qn">ВОПРОС ${idx+1} / ${total}<br><span class="mono" style="color:var(--cyan)">${score} очк. ${streakBadge(streak)}</span></div>
        <div class="timer-wrap"><svg class="timer-ring" viewBox="0 0 40 40">
          <circle class="timer-track" cx="20" cy="20" r="18"/>
          <circle class="timer-bar" id="tbar" cx="20" cy="20" r="18" stroke-dasharray="${circ}" stroke-dashoffset="0"/>
        </svg><span class="timer-num" id="tnum">${qSeconds}</span></div>
      </div>
      <div class="qtext">${q.t}</div>
      <div class="answers" id="ans">${order.map(origI=>`<button class="ans ${isDevMode()&&origI===q.c?'dev-hint':''}" data-i="${origI}">${q.o[origI]}${isDevMode()&&origI===q.c?'<span class="dev-tag">✓</span>':''}</button>`).join('')}</div>
      <button class="btn skip" id="skipBtn" style="margin-top:12px;width:100%">Пропустить →</button>
      <div class="reaction-bar">${['🔥','⚡','👏','💀'].map(e=>`<button class="reaction-btn" data-e="${e}">${e}</button>`).join('')}</div>`;

    const tbar = document.getElementById('tbar'), tnum = document.getElementById('tnum');
    requestAnimationFrame(()=>{ tbar.style.strokeDashoffset = circ; });
    let remain = qSeconds;
    clearInterval(timerInt);
    timerInt = setInterval(()=>{
      remain--;
      tnum.textContent = Math.max(remain,0);
      tbar.classList.toggle('warn', remain<=qSeconds*0.5 && remain>qSeconds*0.25);
      tbar.classList.toggle('danger', remain<=qSeconds*0.25);
      if(remain<=0){ clearInterval(timerInt); if(navigator.vibrate) navigator.vibrate(50); commit(null, 0); }
    }, 1000);

    document.querySelectorAll('.reaction-btn').forEach(b=>b.onclick=()=>{
      db.ref('reactions/'+code).push({emoji:b.dataset.e, ts:Date.now()});
      if(navigator.vibrate) navigator.vibrate(15);
    });

    document.querySelectorAll('#ans .ans').forEach(b=>b.onclick=()=>{
      clearInterval(timerInt);
      const i = +b.dataset.i, ok = i===q.c;
      const pts = ok ? calcPoints(remain, qSeconds, streak) : 0;
      if(navigator.vibrate) navigator.vibrate(ok ? 30 : [40,30,40]);
      b.classList.add(ok?'pick-ok':'pick-bad');
      if(ok){ const pop = document.createElement('span'); pop.className='pts-pop'; pop.textContent='+'+pts; b.appendChild(pop); }
      document.querySelectorAll('#ans .ans').forEach(x=>x.disabled=true);
      document.getElementById('skipBtn').disabled = true;
      setTimeout(()=>commit(i, pts), 550);
    });
    document.getElementById('skipBtn').onclick = ()=>{ clearInterval(timerInt); if(navigator.vibrate) navigator.vibrate(15); commit(null, 0); };
  }

  function commit(optIndex, pts){
    const q = questions[idx];
    const ok = optIndex !== null && optIndex === q.c;
    const qIndex = idx;
    score += pts;
    streak = ok ? streak+1 : 0;
    idx++;
    done = idx >= questions.length;
    const upd = {score, idx, done, streak};
    upd['answers/'+qIndex] = (optIndex===null ? -1 : optIndex);
    myRef.update(upd);
    tick();
  }
}
</script>
