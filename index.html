<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CoreQuiz — core.singl</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg-void:#050a12; --panel-bg:rgba(10,22,36,.55); --panel-border:rgba(0,229,255,.25);
  --cyan:#00e5ff; --cyan-glow:rgba(0,229,255,.5); --red:#ff3b4e; --red-glow:rgba(255,59,78,.5);
  --green:#2bffa8; --green-glow:rgba(43,255,168,.5); --amber:#ffab2e;
  --white:#eaf6ff; --text:#d6ecf5; --dim:#6f92a3;
  --font-d:'Chakra Petch',sans-serif; --font-m:'Space Mono',monospace;
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg-void);color:var(--text);font-family:var(--font-d);min-height:100vh;-webkit-tap-highlight-color:transparent}
body{background-image:radial-gradient(ellipse 100% 70% at 50% 0%,#0a1c2e 0%,var(--bg-void) 55%),linear-gradient(rgba(0,229,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,.035) 1px,transparent 1px);background-size:auto,44px 44px,44px 44px}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:.02em}
.mono{font-family:var(--font-m)}
::selection{background:var(--cyan-glow);color:var(--bg-void)}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:22px 16px 60px;min-height:100vh;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:8px;margin-bottom:20px;color:var(--dim);font-family:var(--font-m);font-size:11px;letter-spacing:.1em}
.top b{color:var(--cyan);text-shadow:0 0 10px var(--cyan-glow);font-family:var(--font-d);font-size:16px;letter-spacing:.03em}
.panel{background:var(--panel-bg);border:1px solid var(--panel-border);border-radius:6px;backdrop-filter:blur(10px);padding:22px;position:relative}
.panel::before,.panel::after{content:'';position:absolute;width:16px;height:16px;border:2px solid var(--cyan);opacity:.9}
.panel::before{top:-1px;left:-1px;border-right:none;border-bottom:none}
.panel::after{bottom:-1px;right:-1px;border-left:none;border-top:none}
.panel.pr::before,.panel.pr::after{border-color:var(--red)}
.stack{display:flex;flex-direction:column;gap:12px}
textarea,input[type=text],input[type=number]{width:100%;background:rgba(5,12,20,.7);border:1px solid var(--panel-border);border-radius:4px;color:var(--white);font-family:var(--font-m);font-size:14px;padding:12px}
textarea{min-height:160px;resize:vertical}
textarea:focus,input:focus{outline:none;border-color:var(--cyan)}
label{font-size:11px;letter-spacing:.1em;color:var(--dim);font-family:var(--font-m)}
.btn{border:1.5px solid var(--cyan);background:rgba(0,229,255,.07);color:var(--white);font-family:var(--font-d);font-weight:600;font-size:15px;letter-spacing:.03em;padding:14px 18px;border-radius:4px;cursor:pointer;transition:.18s;box-shadow:0 0 22px -8px var(--cyan-glow)}
.btn:hover{background:rgba(0,229,255,.15)}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;border-color:var(--panel-border);box-shadow:none;color:var(--dim)}
.btn.red{border-color:var(--red);box-shadow:0 0 22px -8px var(--red-glow)}
.btn.red:hover{background:rgba(255,59,78,.1)}
.btn.skip{border-color:var(--dim);color:var(--dim);box-shadow:none;background:transparent;padding:10px}
.btn[disabled]{opacity:.35;pointer-events:none}
.home-opt{display:block;width:100%;text-align:left;padding:22px;margin-bottom:14px}
.home-opt .lbl{font-family:var(--font-m);font-size:10px;letter-spacing:.15em;color:var(--cyan)}
.home-opt h2{margin-top:6px;font-size:20px}
.code-big{font-family:var(--font-m);font-size:44px;letter-spacing:.15em;color:var(--cyan);text-shadow:0 0 18px var(--cyan-glow);text-align:center;margin:10px 0}
.hint{color:var(--dim);font-size:13px;line-height:1.6}
.qprev{border:1px solid var(--panel-border);border-radius:4px;padding:12px;margin-top:10px}
.qprev .n{font-family:var(--font-m);font-size:11px;color:var(--cyan)}
.opt-row{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px}
.opt-row .m{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--panel-border);flex:none}
.opt-row.ok{color:var(--green)}
.opt-row.ok .m{background:var(--green);border-color:var(--green);box-shadow:0 0 6px var(--green-glow)}
.warn{color:var(--red);font-size:12px;margin-top:6px;font-family:var(--font-m)}
.plist{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.prow{display:flex;justify-content:space-between;padding:9px 12px;border:1px solid var(--panel-border);border-radius:4px;font-size:14px;animation:in .35s var(--ease)}
.qn{font-family:var(--font-m);color:var(--dim);font-size:12px;letter-spacing:.1em;margin-bottom:8px}
.qtext{font-size:21px;font-weight:600;line-height:1.4;margin-bottom:18px;animation:in .45s var(--ease)}
.answers{display:grid;gap:10px}
.ans{text-align:left;padding:16px;border:1.5px solid var(--panel-border);border-radius:6px;background:rgba(10,22,36,.4);color:var(--white);font-family:var(--font-d);font-size:16px;cursor:pointer;transition:border-color .15s;animation:in .45s var(--ease) backwards}
.ans:nth-child(1){animation-delay:.03s}.ans:nth-child(2){animation-delay:.08s}.ans:nth-child(3){animation-delay:.13s}.ans:nth-child(4){animation-delay:.18s}
.ans:hover{border-color:var(--cyan)}
.ans.pick-ok{border-color:var(--green);background:rgba(43,255,168,.08);box-shadow:0 0 18px -6px var(--green-glow);animation:correctPulse .35s}
.ans.pick-bad{border-color:var(--red);background:rgba(255,59,78,.08);box-shadow:0 0 18px -6px var(--red-glow);animation:shake .4s}
@keyframes correctPulse{0%{transform:scale(1)}50%{transform:scale(1.035)}100%{transform:scale(1)}}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.timer-wrap{position:relative;width:58px;height:58px;flex:none}
.timer-ring{transform:rotate(-90deg)}
.timer-track{fill:none;stroke:rgba(255,255,255,.08);stroke-width:4}
.timer-bar{fill:none;stroke:var(--cyan);stroke-width:4;stroke-linecap:round;transition:stroke-dashoffset 1s linear,stroke .3s}
.timer-bar.warn{stroke:var(--amber)}
.timer-bar.danger{stroke:var(--red)}
.timer-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-m);font-size:16px;color:var(--white)}
.center{text-align:center}
.qrbox{background:#eaf6ff;padding:10px;border-radius:8px;width:fit-content;margin:14px auto 0}
.linkbox{display:flex;gap:8px;margin-top:14px}
.linkbox input{flex:1;font-size:11px}
.lbrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--panel-border);border-radius:6px;margin-bottom:8px;background:rgba(10,22,36,.4)}
.lbrow .rank{font-family:var(--font-m);color:var(--cyan);width:20px;flex:none}
.lbrow .nm{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbrow .prog{font-family:var(--font-m);font-size:11px;color:var(--dim);flex:none}
.lbrow .sc{font-family:var(--font-m);color:var(--white);width:38px;text-align:right;flex:none}
.lbrow:first-child{border-color:var(--cyan);box-shadow:0 0 16px -8px var(--cyan-glow)}
.podium{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.prank{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--panel-border);border-radius:6px;animation:in .4s var(--ease) backwards}
.prank:nth-child(1){animation-delay:.05s;border-color:var(--cyan);box-shadow:0 0 20px -8px var(--cyan-glow)}
.prank:nth-child(2){animation-delay:.15s}.prank:nth-child(3){animation-delay:.25s}.prank:nth-child(n+4){animation-delay:.35s}
.prank .num{font-family:var(--font-m);color:var(--cyan);width:22px}
.prank .nm{flex:1;font-weight:600}
.prank .sc{font-family:var(--font-m);color:var(--dim)}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.waiting{animation:pulse 1.4s ease-in-out infinite}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><b>CoreQuiz</b><span>/ core.singl</span></div>
  <div id="app" style="flex:1"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
// === FIREBASE: вставь сюда свой config из Firebase Console (Project settings → Web app) ===
const firebaseConfig = {
  "projectId": "corequiz-daniil",
  "appId": "1:664276362902:web:1fd30d26cdc027a04b84b7",
  "databaseURL": "https://corequiz-daniil-default-rtdb.asia-southeast1.firebasedatabase.app",
  "storageBucket": "corequiz-daniil.firebasestorage.app",
  "apiKey": "AIzaSyD2kJbudPbC3WuyJRgXuHW3UoWplcbK8jE",
  "authDomain": "corequiz-daniil.firebaseapp.com",
  "messagingSenderId": "664276362902",
  "measurementId": "G-60HFQNWSHC",
  "projectNumber": "664276362902",
  "version": "2"
};
let db = null, dbReady = false;
try { firebase.initializeApp(firebaseConfig); db = firebase.database(); dbReady = true; } catch(e) {}

const app = document.getElementById('app');
const genCode = () => Math.random().toString(36).slice(2,7).toUpperCase();
const genId = () => Math.random().toString(36).slice(2,10);

function needsSetup(){
  if(dbReady && firebaseConfig.apiKey !== 'PASTE_ME') return false;
  app.innerHTML = `<div class="panel pr"><h2 style="color:var(--red)">FIREBASE NOT CONFIGURED</h2>
    <p class="hint">Вставь свои ключи в <span class="mono">firebaseConfig</span>.</p></div>`;
  return true;
}

function parseQuiz(raw){
  const lines = raw.replace(/\r/g,'').split('\n');
  const blocks = []; let cur = null;
  const qStart = /^\s*\d+[\.\)]\s*(.+)/, oStart = /^\s*([A-FА-Е])[\.\):]\s*(.+)/;
  for(const line of lines){
    if(!line.trim()) continue;
    const qm = line.match(qStart);
    if(qm && !line.trim().match(oStart)){ cur = {text: qm[1].trim(), options: []}; blocks.push(cur); continue; }
    const om = line.match(oStart);
    if(om && cur){
      let t = om[2].trim();
      const correct = /\[(правильный|верный|correct)\]|\[\+\]|\*\s*$/i.test(t);
      t = t.replace(/\[(правильный|верный|correct)\]|\[\+\]/ig,'').replace(/\*\s*$/,'').trim();
      cur.options.push({text:t, correct});
    }
  }
  blocks.forEach(q=>{
    const c = q.options.filter(o=>o.correct).length;
    q.warn = q.options.length<2 ? 'меньше двух вариантов' : c===0 ? 'правильный ответ не найден' : c>1 ? 'больше одного правильного' : null;
  });
  return blocks.filter(q=>q.text);
}

function nav(h){ location.hash = h; }
window.addEventListener('hashchange', render);
window.addEventListener('load', render);

function render(){
  if(needsSetup()) return;
  const [route, a] = location.hash.slice(2).split('/');
  if(route==='create') return createView();
  if(route==='host') return hostView(a);
  if(route==='join') return joinView(a);
  if(route==='play') return playView(a);
  homeView();
}

function homeView(){
  app.innerHTML = `
    <button class="panel home-opt" id="toCreate"><div class="lbl">01 / ORGANIZER</div><h2>Создать тест</h2><p class="hint">Вставь вопросы текстом — запусти живую сессию для группы.</p></button>
    <button class="panel home-opt" id="toJoin"><div class="lbl">02 / PARTICIPANT</div><h2>Подключиться</h2><p class="hint">Есть код от организатора — заходи и отвечай.</p></button>`;
  document.getElementById('toCreate').onclick = ()=>nav('#/create');
  document.getElementById('toJoin').onclick = ()=>nav('#/join');
}

function createView(){
  app.innerHTML = `
    <div class="panel stack">
      <div><label>НАЗВАНИЕ</label><input type="text" id="title" placeholder="Тест по теме..."></div>
      <div><label>СЕКУНД НА ВОПРОС</label><input type="number" id="secs" value="20" min="5" max="120"></div>
      <div><label>ВОПРОСЫ</label>
        <textarea id="src" placeholder="1. Что измеряется в амперах?
A) Напряжение
B) Сила тока [правильный]
C) Сопротивление
D) Мощность"></textarea>
      </div>
      <div class="hint">Нумерация «1.»/«1)», варианты «A)» «A.» «A:», метка правильного — [правильный] / [correct] / [+] / *</div>
      <button class="btn" id="parse">Разобрать</button>
      <div id="preview"></div>
    </div>`;
  document.getElementById('parse').onclick = ()=>{
    const qs = parseQuiz(document.getElementById('src').value);
    const pv = document.getElementById('preview');
    if(!qs.length){ pv.innerHTML = '<div class="warn">Вопросы не найдены.</div>'; return; }
    const bad = qs.filter(q=>q.warn).length;
    let html = `<div class="hint">Найдено: ${qs.length}${bad?`, с ошибками: <span style="color:var(--red)">${bad}</span>`:''}</div>`;
    qs.forEach((q,i)=>{
      html += `<div class="qprev"><div class="n">В${i+1}</div><div style="margin:5px 0;font-weight:600">${q.text}</div>`;
      q.options.forEach(o=>html += `<div class="opt-row ${o.correct?'ok':''}"><span class="m"></span>${o.text}</div>`);
      if(q.warn) html += `<div class="warn">⚠ ${q.warn}</div>`;
      html += `</div>`;
    });
    html += bad ? '<div class="warn">Исправь текст и разбери заново.</div>' : '<button class="btn" id="launch">Запустить сессию</button>';
    pv.innerHTML = html;
    const l = document.getElementById('launch');
    if(l) l.onclick = ()=>{
      const title = document.getElementById('title').value.trim() || 'Тест';
      const qSeconds = Math.max(5, +document.getElementById('secs').value || 20);
      const code = genCode();
      db.ref('sessions/'+code).set({
        title, status:'lobby', qSeconds, createdAt:Date.now(),
        questions: qs.map(q=>({t:q.text, o:q.options.map(o=>o.text), c:q.options.findIndex(o=>o.correct)}))
      }).then(()=>nav('#/host/'+code));
    };
  };
}

function hostView(code){
  const sRef = db.ref('sessions/'+code), pRef = db.ref('participants/'+code);
  const joinUrl = location.origin+location.pathname+'#/join/'+code;
  app.innerHTML = `<div class="panel center"><label>КОД СЕССИИ</label><div class="code-big">${code}</div>
    <div class="linkbox"><input type="text" readonly value="${joinUrl}" id="lk"><button class="btn ghost" id="cp">Копир.</button></div>
    <div class="qrbox" id="qr"></div></div>
    <div id="hostBody"></div>`;
  document.getElementById('cp').onclick = ()=>{ document.getElementById('lk').select(); document.execCommand('copy'); };
  new QRCode(document.getElementById('qr'), {text: joinUrl, width:150, height:150, colorDark:"#0a1c2e", colorLight:"#eaf6ff"});

  let sessionData = null, total = 0;
  sRef.on('value', snap=>{
    sessionData = snap.val(); if(!sessionData) return;
    total = (sessionData.questions||[]).length;
    drawHost();
  });

  function drawHost(){
    const body = document.getElementById('hostBody');
    if(sessionData.status==='lobby'){
      pRef.on('value', psnap=>{
        const names = Object.values(psnap.val() || {});
        body.innerHTML = `<div class="panel" style="margin-top:12px"><label>ПОДКЛЮЧИЛИСЬ (${names.length})</label>
          <div class="plist">${names.map(p=>`<div class="prow">${p.name}</div>`).join('') || '<span class="hint">Пока никого</span>'}</div>
          <div style="margin-top:14px"><button class="btn" id="start" ${names.length?'':'disabled'}>Начать тест</button></div></div>`;
        const st = document.getElementById('start');
        if(st) st.onclick = ()=>sRef.update({status:'running'});
      });
    } else {
      body.innerHTML = `<div class="panel" style="margin-top:12px"><label>ЖИВОЙ ТОП</label><div id="board" style="margin-top:12px"></div>
        ${sessionData.status==='running' ? '<button class="btn red ghost" id="forceEnd">Завершить для всех</button>' : '<h2 style="margin-top:10px">Тест завершён</h2>'}</div>`;
      const fe = document.getElementById('forceEnd');
      if(fe) fe.onclick = ()=>sRef.update({status:'finished'});
      pRef.on('value', psnap=>{
        const list = Object.entries(psnap.val()||{}).map(([pid,v])=>({pid,...v}));
        renderLeaderboard(list, total);
      });
    }
  }
}

function renderLeaderboard(list, total){
  const el = document.getElementById('board');
  if(!el) return;
  const prevTop = {};
  el.querySelectorAll('.lbrow').forEach(r=>{ prevTop[r.dataset.pid] = r.getBoundingClientRect().top; });
  const sorted = list.slice().sort((a,b)=> (b.score||0)-(a.score||0) || (b.idx||0)-(a.idx||0));
  el.innerHTML = sorted.map((p,i)=>`<div class="lbrow" data-pid="${p.pid}">
      <span class="rank">${i+1}</span><span class="nm">${p.name}</span>
      <span class="prog">${p.done?'✓ готово':(p.idx||0)+'/'+total}</span>
      <span class="sc">${p.score||0}</span></div>`).join('') || '<span class="hint">Пока никого</span>';
  el.querySelectorAll('.lbrow').forEach(r=>{
    const pid = r.dataset.pid, newTop = r.getBoundingClientRect().top, oldTop = prevTop[pid];
    if(oldTop !== undefined){
      const d = oldTop - newTop;
      if(Math.abs(d) > 1){
        r.style.transition = 'none'; r.style.transform = `translateY(${d}px)`;
        requestAnimationFrame(()=>{ r.style.transition = 'transform .45s cubic-bezier(.16,1,.3,1)'; r.style.transform = ''; });
      }
    } else {
      r.style.opacity = '0'; r.style.transform = 'translateY(8px)';
      requestAnimationFrame(()=>{ r.style.transition = '.35s'; r.style.opacity = '1'; r.style.transform = ''; });
    }
  });
}

function joinView(prefill){
  app.innerHTML = `<div class="panel stack">
    <div><label>КОД СЕССИИ</label><input type="text" id="code" style="text-transform:uppercase" value="${prefill||''}"></div>
    <div><label>ТВОЁ ИМЯ</label><input type="text" id="name"></div>
    <button class="btn" id="go">Войти</button><div id="err"></div></div>`;
  document.getElementById('go').onclick = ()=>{
    const code = document.getElementById('code').value.trim().toUpperCase();
    const name = document.getElementById('name').value.trim();
    const err = document.getElementById('err');
    if(!code || !name){ err.innerHTML = '<div class="warn">Заполни код и имя</div>'; return; }
    db.ref('sessions/'+code).once('value').then(snap=>{
      if(!snap.exists()){ err.innerHTML = '<div class="warn">Сессия не найдена</div>'; return; }
      const pid = genId();
      db.ref(`participants/${code}/${pid}`).set({name, score:0, idx:0, done:false}).then(()=>{
        localStorage.setItem('cq_'+code, JSON.stringify({pid, name}));
        nav('#/play/'+code);
      });
    });
  };
}

function playView(code){
  const saved = JSON.parse(localStorage.getItem('cq_'+code) || 'null');
  if(!saved){ nav('#/join/'+code); return; }
  const pid = saved.pid;
  const sRef = db.ref('sessions/'+code), myRef = db.ref(`participants/${code}/${pid}`);
  let idx = 0, score = 0, done = false, questions = [], qSeconds = 20, forcedEnd = false, drawnFor = -1, timerInt = null;

  sRef.on('value', snap=>{
    const s = snap.val(); if(!s) return;
    questions = s.questions || []; qSeconds = s.qSeconds || 20;
    if(s.status === 'finished') forcedEnd = true;
    if(s.status === 'lobby' && drawnFor === -1) app.innerHTML = `<div class="panel center waiting"><h2>${s.title}</h2><p class="hint">Ожидание начала...</p></div>`;
    if(s.status === 'running' || forcedEnd) tick();
  });
  myRef.once('value').then(snap=>{
    const p = snap.val() || {}; idx = p.idx||0; score = p.score||0; done = !!p.done; tick();
  });

  function tick(){
    if(!questions.length) return;
    if(done || forcedEnd){ clearInterval(timerInt); showResult(); return; }
    if(drawnFor !== idx) drawQuestion();
  }

  function showResult(){
    app.innerHTML = `<div class="panel center"><h2>Тест завершён</h2><div class="code-big">${score}/${questions.length}</div><p class="hint">${saved.name}</p></div>`;
  }

  function drawQuestion(){
    drawnFor = idx;
    const q = questions[idx], total = questions.length;
    const circ = 2*Math.PI*18;
    app.innerHTML = `
      <div class="qhead">
        <div class="qn">ВОПРОС ${idx+1} / ${total}<br><span class="mono">${score} очк.</span></div>
        <div class="timer-wrap"><svg class="timer-ring" viewBox="0 0 40 40">
          <circle class="timer-track" cx="20" cy="20" r="18"/>
          <circle class="timer-bar" id="tbar" cx="20" cy="20" r="18" stroke-dasharray="${circ}" stroke-dashoffset="0"/>
        </svg><span class="timer-num" id="tnum">${qSeconds}</span></div>
      </div>
      <div class="qtext">${q.t}</div>
      <div class="answers" id="ans">${q.o.map((o,i)=>`<button class="ans" data-i="${i}">${o}</button>`).join('')}</div>
      <button class="btn skip" id="skipBtn" style="margin-top:12px;width:100%">Пропустить →</button>`;

    const tbar = document.getElementById('tbar'), tnum = document.getElementById('tnum');
    requestAnimationFrame(()=>{ tbar.style.strokeDashoffset = circ; });
    let remain = qSeconds;
    clearInterval(timerInt);
    timerInt = setInterval(()=>{
      remain--;
      tnum.textContent = Math.max(remain,0);
      tbar.classList.toggle('warn', remain<=qSeconds*0.5 && remain>qSeconds*0.25);
      tbar.classList.toggle('danger', remain<=qSeconds*0.25);
      if(remain<=0){ clearInterval(timerInt); commit(null); }
    }, 1000);

    document.querySelectorAll('#ans .ans').forEach(b=>b.onclick=()=>{
      clearInterval(timerInt);
      const i = +b.dataset.i, ok = i===q.c;
      b.classList.add(ok?'pick-ok':'pick-bad');
      document.querySelectorAll('#ans .ans').forEach(x=>x.disabled=true);
      document.getElementById('skipBtn').disabled = true;
      setTimeout(()=>commit(i), 500);
    });
    document.getElementById('skipBtn').onclick = ()=>{ clearInterval(timerInt); commit(null); };
  }

  function commit(optIndex){
    const q = questions[idx];
    const ok = optIndex !== null && optIndex === q.c;
    if(ok) score++;
    idx++;
    done = idx >= questions.length;
    myRef.update({score, idx, done});
    tick();
  }
}
</script>
</body>
</html>
